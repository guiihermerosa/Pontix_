services:
  - type: web
    name: pontix-api
    runtime: python
    pythonVersion: 3.12
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:$PORT app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATABASE_URL
        scope: build
        sync: false
      - key: SUPABASE_URL
        scope: build
        sync: false
      - key: SUPABASE_KEY
        scope: build
        sync: false
      - key: SECRET_KEY
        scope: build
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
    buildCommand: pip install -r requirements.txt
    health:
      path: /health
      pollInterval: 30
    autoDeploy: true
