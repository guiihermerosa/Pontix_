# Render Blueprint para deploy do Pontix API
# Documentação: https://render.com/docs/blueprint-spec

services:
  # API FastAPI
  - type: web
    name: pontix-api
    env: python
    region: sao-paulo  # Região América do Sul
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Configurações obrigatórias
      - key: DEBUG
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      # Configurações recomendadas
      - key: CORS_ORIGINS
        value: https://*.vercel.app,https://pontix.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: pontix-db
          property: connectionString
      # Otimizações
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/opt/render/project/src"
    
    # Planejamento
    plan: starter
    numInstances: 1
    disk:
      name: data
      mountPath: /data
      sizeGB: 1

  # Worker para sincronização (opcional)
  - type: worker
    name: pontix-sync-worker
    env: python
    region: sao-paulo
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.services.sync_worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SYNC_INTERVAL_MINUTES
        value: "5"
    plan: starter

databases:
  # Banco de dados local para sistema offline (opcional no Render)
  - name: pontix-db
    databaseName: pontix
    user: pontix
    region: sao-paulo
    plan: starter
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

# Variáveis de ambiente globais (shared entre serviços)
envVars:
  - key: APP_URL
    value: https://pontix-api.onrender.com
  - key: WEB_APP_URL
    value: https://pontix.vercel.app
  - key: LOG_LEVEL
    value: INFO
  - key: ACCESS_TOKEN_EXPIRE_MINUTES
    value: "30"